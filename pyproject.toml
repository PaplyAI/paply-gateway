[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paplyai-gateway"
version = "0.3.0"
description = "PaplyAI identity, model access, routing control, and usage governance gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "pydantic-settings==2.14.1",
  "python-multipart==0.0.22",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.15.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["paplyai_gateway"]
