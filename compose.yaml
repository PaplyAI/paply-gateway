name: paplyai-gateway

services:
  gateway:
    build:
      context: .
      args:
        APT_MIRROR_BASE: ${APT_MIRROR_BASE:-http://deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-100}
    restart: unless-stopped
    environment:
      PAPLY_ENVIRONMENT: ${PAPLY_ENVIRONMENT}
      PAPLY_LITELLM_URL: http://litellm:4000
      PAPLY_MODELS_CONFIG_PATH: /app/config/paply-models.yaml
      PAPLY_SKILLS_CATALOG_PATH: /catalog/catalog.json
      PAPLY_SKILLS_STORAGE: ${PAPLY_SKILLS_STORAGE:-local}
      PAPLY_SKILLS_OSS_ENDPOINT: ${PAPLY_SKILLS_OSS_ENDPOINT:-}
      PAPLY_SKILLS_OSS_REGION: ${PAPLY_SKILLS_OSS_REGION:-}
      PAPLY_SKILLS_OSS_BUCKET: ${PAPLY_SKILLS_OSS_BUCKET:-}
      PAPLY_SKILLS_OSS_PREFIX: ${PAPLY_SKILLS_OSS_PREFIX:-skills}
      PAPLY_SKILLS_OSS_CREDENTIALS: ${PAPLY_SKILLS_OSS_CREDENTIALS:-ecs_ram_role}
      PAPLY_SKILLS_OSS_ECS_ROLE_NAME: ${PAPLY_SKILLS_OSS_ECS_ROLE_NAME:-}
      PAPLY_ACCOUNTS_DB_PATH: /data/accounts.sqlite3
      PAPLY_AUTH_JWT_SECRET: ${PAPLY_AUTH_JWT_SECRET}
      PAPLY_AUTH_JWT_ISSUER: ${PAPLY_AUTH_JWT_ISSUER:-paply}
      PAPLY_AUTH_JWT_AUDIENCE: ${PAPLY_AUTH_JWT_AUDIENCE:-paplyai-gateway}
      PAPLY_AUTH_ACCESS_TOKEN_SECONDS: ${PAPLY_AUTH_ACCESS_TOKEN_SECONDS:-3600}
      PAPLY_AUTH_REFRESH_TOKEN_SECONDS: ${PAPLY_AUTH_REFRESH_TOKEN_SECONDS:-2592000}
      PAPLY_DEFAULT_USER_BUDGET: ${PAPLY_DEFAULT_USER_BUDGET:-20}
      PAPLY_DEFAULT_USER_BUDGET_DURATION: ${PAPLY_DEFAULT_USER_BUDGET_DURATION:-30d}
      PAPLY_LITELLM_SERVICE_TOKEN: ${PAPLY_LITELLM_SERVICE_TOKEN}
      PAPLY_PUBLIC_BASE_URL: ${PAPLY_PUBLIC_BASE_URL}
      PAPLY_LITELLM_UI_PUBLIC_URL: ${PAPLY_LITELLM_UI_PUBLIC_URL:-}
      PAPLY_UPSTREAM_TIMEOUT_SECONDS: ${PAPLY_UPSTREAM_TIMEOUT_SECONDS:-600}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "4387:4387"
    depends_on:
      litellm:
        condition: service_healthy
    volumes:
      - ${PAPLY_SKILLS_CATALOG_HOST_PATH:-../paplyai-skills}:/catalog:ro
      - gateway_accounts:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4387/health/live')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  admin:
    build:
      context: .
      args:
        APT_MIRROR_BASE: ${APT_MIRROR_BASE:-http://deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-100}
    restart: unless-stopped
    command: ["uvicorn", "paplyai_gateway.admin_main:app", "--host", "0.0.0.0", "--port", "4390", "--proxy-headers", "--forwarded-allow-ips=*"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      PAPLY_ADMIN_PASSWORD: ${PAPLY_ADMIN_PASSWORD}
      PAPLY_ADMIN_SESSION_SECRET: ${PAPLY_ADMIN_SESSION_SECRET}
      PAPLY_ADMIN_USERNAME: ${PAPLY_ADMIN_USERNAME}
      PAPLY_ENVIRONMENT: ${PAPLY_ENVIRONMENT}
      PAPLY_GATEWAY_INTERNAL_URL: http://gateway:4387
      PAPLY_LITELLM_URL: http://litellm:4000
      PAPLY_LITELLM_UI_PUBLIC_URL: ${PAPLY_LITELLM_UI_PUBLIC_URL:-}
      PAPLY_MODELS_CONFIG_PATH: /app/config/paply-models.yaml
      PAPLY_PUBLIC_BASE_URL: ${PAPLY_PUBLIC_BASE_URL}
      PAPLY_SKILLS_STORAGE: ${PAPLY_SKILLS_STORAGE:-local}
      PAPLY_SKILLS_OSS_ENDPOINT: ${PAPLY_SKILLS_OSS_ENDPOINT:-}
      PAPLY_SKILLS_OSS_REGION: ${PAPLY_SKILLS_OSS_REGION:-}
      PAPLY_SKILLS_OSS_BUCKET: ${PAPLY_SKILLS_OSS_BUCKET:-}
      PAPLY_SKILLS_OSS_PREFIX: ${PAPLY_SKILLS_OSS_PREFIX:-skills}
      PAPLY_SKILLS_OSS_CREDENTIALS: ${PAPLY_SKILLS_OSS_CREDENTIALS:-ecs_ram_role}
      PAPLY_SKILLS_OSS_ECS_ROLE_NAME: ${PAPLY_SKILLS_OSS_ECS_ROLE_NAME:-}
      PAPLY_SKILLS_GITHUB_REPOSITORY: ${PAPLY_SKILLS_GITHUB_REPOSITORY:-PaplyAI/paplyai-skills}
      PAPLY_SKILLS_GITHUB_REF: ${PAPLY_SKILLS_GITHUB_REF:-main}
      PAPLY_SKILLS_GITHUB_CATALOG_PATH: ${PAPLY_SKILLS_GITHUB_CATALOG_PATH:-catalog.json}
      PAPLY_SKILLS_GITHUB_TOKEN: ${PAPLY_SKILLS_GITHUB_TOKEN:-}
    ports:
      - "${PAPLY_ADMIN_BIND_ADDRESS:-127.0.0.1}:4390:4390"
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4390/health/live')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: paplyai/litellm-zh:v1.96.0
    restart: unless-stopped
    command: ["--config=/app/config.yaml", "--port=4000", "--num_workers=1"]
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      PAPLY_LITELLM_SERVICE_TOKEN: ${PAPLY_LITELLM_SERVICE_TOKEN}
      UI_USERNAME: ${LITELLM_UI_USERNAME}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    ports:
      - "${PAPLY_LITELLM_UI_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  gateway_accounts:
  postgres_data:
  redis_data:
