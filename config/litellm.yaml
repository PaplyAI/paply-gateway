# Deployments are managed through LiteLLM's PostgreSQL-backed control plane.
# Keeping this list empty makes every upstream editable from the native UI and
# prevents an uneditable config-owned deployment from joining a model group.
model_list: []

litellm_settings:
  telemetry: false
  drop_params: false
  request_timeout: 600
  num_retries: 0
  overwrite_user_with_key_hash: false
  success_callback: [prometheus]

router_settings:
  enable_pre_call_checks: true
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  custom_auth: litellm_custom_auth.user_api_key_auth
  custom_auth_settings:
    mode: auto
  custom_auth_run_common_checks: true
  enable_post_custom_auth_checks: true
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  database_connection_pool_limit: 10
  proxy_batch_write_at: 1
  disable_spend_logs: false
